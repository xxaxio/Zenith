<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" role="img" aria-labelledby="mt-title mt-desc">
  <title id="mt-title">Meridian &amp; Zenith Integration Topology</title>
  <desc id="mt-desc">Players connect to the reverse proxy, which routes directly to game backends or fails over to the Zenith virtual Limbo daemon, which drains players back to the backends with 0x84 transfers.</desc>

  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
    <pattern id="dotGridMt" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.8"/>
    </pattern>
    <marker id="mtCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="mtAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#f59e0b"/>
    </marker>
    <marker id="mtSlate" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#64748b"/>
    </marker>
    <marker id="mtGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#10b981"/>
    </marker>
    <clipPath id="topo-clip-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="520" rx="12" fill="#0b0f19"/>
  <rect width="1000" height="520" rx="12" fill="url(#dotGridMt)"/>
  <rect width="1000" height="520" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#0ea5e9"/>
    <text x="18" y="16" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">GATEWAY &amp; ZENITH INTEGRATION TOPOLOGY</text>
    <text x="18" y="32" class="sans" font-size="11" font-weight="500" fill="#64748b">REVERSE PROXY ROUTING, HMAC CRYPTOGRAPHIC FORWARDING &amp; SEAMLESS TRANSIT</text>
  </g>

  <!-- Status Badge Top-Right -->
  <g transform="translate(826, 36)">
    <rect width="126" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#10b981"/>
    <text x="24" y="18" class="mono" font-size="10.5" font-weight="600" fill="#10b981">ZERO DOWNTIME</text>
  </g>

  <!-- Direct Route (Online normal traffic) -->
  <path d="M 360 160 C 360 110, 850 110, 850 152" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#mtSlate)"/>
  <rect x="546" y="102" width="168" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="630" y="114" class="mono" font-size="9" fill="#94a3b8" text-anchor="middle">Normal Direct Routing (Online)</text>

  <!-- Failover Route (to Zenith) -->
  <path d="M 430 220 L 492 220" fill="none" stroke="#f59e0b" stroke-width="1.75" marker-end="url(#mtAmber)"/>
  <rect x="440" y="208" width="48" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="464" y="220" class="mono" font-size="9" fill="#fbbf24" text-anchor="middle">Failover</text>

  <!-- Return Transit Route (Zenith to Backends) -->
  <path d="M 700 220 L 762 220" fill="none" stroke="#10b981" stroke-width="1.75" stroke-dasharray="5 3" marker-end="url(#mtGreen)"/>
  <rect x="708" y="208" width="54" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="735" y="220" class="mono" font-size="9" fill="#34d399" text-anchor="middle">0x84 Drain</text>

  <!-- Client to Proxy -->
  <path d="M 188 220 L 242 220" fill="none" stroke="#0ea5e9" stroke-width="1.75" marker-end="url(#mtCyan)"/>

  <!-- ==================== MAIN TOPOLOGY NODES ==================== -->
  <!-- NODE 1: Clients -->
  <g transform="translate(48, 160)">
    <rect width="140" height="120" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="#0ea5e9"/>
    <text x="14" y="24" class="mono" font-size="9" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">01 • CLIENTS</text>
    <text x="14" y="48" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Players</text>
    <text x="14" y="70" class="sans" font-size="11" fill="#94a3b8">Vanilla 1.21+ / 26.3</text>
    <text x="14" y="88" class="sans" font-size="10.5" fill="#64748b">Horizon &amp; Third-party</text>
  </g>

  <!-- NODE 2: Gateway / Reverse Proxy -->
  <g transform="translate(248, 160)">
    <rect width="182" height="120" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="182" height="3" rx="1.5" fill="#0ea5e9"/>
    <text x="14" y="24" class="mono" font-size="9" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">02 • REVERSE PROXY</text>
    <text x="14" y="48" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Network Gateway</text>
    <text x="14" y="70" class="sans" font-size="11" fill="#94a3b8">Rust Async Reverse Router</text>
    <rect x="14" y="82" width="148" height="22" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.25"/>
    <text x="88" y="96" class="mono" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">HMAC-SHA256 Token</text>
  </g>

  <!-- NODE 3: Zenith Daemon (Hero) -->
  <g transform="translate(500, 146)">
    <rect width="200" height="148" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.75"/>
    <rect x="0" y="0" width="200" height="3" rx="1.5" fill="#f59e0b"/>
    <text x="16" y="24" class="mono" font-size="9" font-weight="700" fill="#fbbf24" letter-spacing="0.8">03 • ZENITH DAEMON</text>
    <text x="16" y="48" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Virtual Limbo Void</text>
    <text x="16" y="72" class="sans" font-size="11" fill="#cbd5e1">• Zero-Chunk Void (&lt; 1 KiB RAM)</text>
    <text x="16" y="90" class="sans" font-size="11" fill="#cbd5e1">• Adaptive Wave Transit Queue</text>
    <text x="16" y="108" class="sans" font-size="11" fill="#cbd5e1">• Cyber-Defense Kernel Shield</text>
    <rect x="16" y="118" width="168" height="18" rx="4" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.25"/>
    <text x="100" y="130" class="mono" font-size="9" font-weight="600" fill="#fbbf24" text-anchor="middle">Soft-Drain &amp; Retention</text>
  </g>

  <!-- NODE 4: Game Backends -->
  <g transform="translate(768, 160)">
    <rect width="184" height="120" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="184" height="3" rx="1.5" fill="#10b981"/>
    <text x="14" y="24" class="mono" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.8">04 • BACKENDS</text>
    <text x="14" y="48" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Horizon Servers</text>
    <text x="14" y="70" class="sans" font-size="11" fill="#94a3b8">Dedicated Nodes / Paper</text>
    <text x="14" y="88" class="sans" font-size="10.5" fill="#64748b">Port :25566+ (Internal)</text>
  </g>

  <!-- ==================== BOTTOM ROW 3 SUMMARY CARDS ==================== -->
  <g transform="translate(48, 340)">
    <rect width="288" height="140" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#0ea5e9"/>
    <text x="18" y="26" class="mono" font-size="9.5" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">1. PROXY DELESTING</text>
    <text x="18" y="48" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Automated Failover Routing</text>
    <text x="18" y="70" class="sans" font-size="11" fill="#94a3b8">Reverse proxy routes connecting traffic</text>
    <text x="18" y="88" class="sans" font-size="11" fill="#94a3b8">to Zenith whenever target backends</text>
    <text x="18" y="106" class="sans" font-size="11" fill="#94a3b8">are restarting or saturated.</text>
    <text x="18" y="126" class="mono" font-size="10" font-weight="600" fill="#38bdf8">0 disconnected players</text>
  </g>

  <g transform="translate(356, 340)">
    <rect width="288" height="140" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#f59e0b"/>
    <text x="18" y="26" class="mono" font-size="9.5" font-weight="700" fill="#fbbf24" letter-spacing="0.8">2. VOID RETENTION</text>
    <text x="18" y="48" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Lightweight Limbo Engine</text>
    <text x="18" y="70" class="sans" font-size="11" fill="#94a3b8">Holds 5,000 to 85,000+ players in zero-chunk</text>
    <text x="18" y="88" class="sans" font-size="11" fill="#94a3b8">virtual space with animated BossBar,</text>
    <text x="18" y="106" class="sans" font-size="11" fill="#94a3b8">interactive chat, and sound alerts.</text>
    <text x="18" y="126" class="mono" font-size="10" font-weight="600" fill="#fbbf24">&lt; 10 MB RAM / 1,000 players</text>
  </g>

  <g transform="translate(664, 340)">
    <rect width="288" height="140" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#10b981"/>
    <text x="18" y="26" class="mono" font-size="9.5" font-weight="700" fill="#10b981" letter-spacing="0.8">3. SEAMLESS REINJECTION</text>
    <text x="18" y="48" class="sans" font-size="13" font-weight="700" fill="#f8fafc">0x84 Cookie Transfer Handover</text>
    <text x="18" y="70" class="sans" font-size="11" fill="#94a3b8">As soon as backends are ready,</text>
    <text x="18" y="88" class="sans" font-size="11" fill="#94a3b8">Zenith drains players in controlled waves</text>
    <text x="18" y="106" class="sans" font-size="11" fill="#94a3b8">via native Protocol 777 transfers.</text>
    <text x="18" y="126" class="mono" font-size="10" font-weight="600" fill="#10b981">Zero login freeze</text>
  </g>
</svg>