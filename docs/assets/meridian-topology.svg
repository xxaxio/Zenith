<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMeridian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="zenithHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="gridMeri" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <clipPath id="topo-clip-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="520" rx="14" fill="url(#bgMeridian)"/>
  <rect width="1000" height="520" rx="14" fill="url(#gridMeri)"/>
  <rect width="1000" height="520" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc" letter-spacing="0.5">MERIDIAN &amp; ZENITH INTEGRATION TOPOLOGY</text>
  <text x="50" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">REVERSE PROXY ROUTING, HMAC CRYPTOGRAPHIC FORWARDING &amp; SEAMLESS TRANSIT</text>

  <!-- Flow Connectors -->
  <!-- Players -> Meridian -->
  <path d="M 190 180 L 250 180" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="250,176 260,180 250,184" fill="#38bdf8"/>
  <text x="198" y="170" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#38bdf8">:25565</text>

  <!-- Meridian -> Zenith (Fallback Limbo on crash / queue) -->
  <path d="M 440 180 L 500 180" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="500,176 510,180 500,184" fill="#f59e0b"/>
  <text x="444" y="170" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#f59e0b">Crash/Hold</text>

  <!-- Meridian -> Backend Direct (Normal Flow) -->
  <path d="M 350 230 C 350 310, 680 310, 770 230" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="520" y="318" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#64748b">Normal Game Traffic (Online)</text>

  <!-- Zenith -> Backend (Seamless Transfer 0x84) -->
  <path d="M 690 180 L 760 180" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="760,176 770,180 760,184" fill="#10b981"/>
  <text x="696" y="170" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#10b981">0x84 Transfer</text>

  <!-- Zenith IPC Turbo -> Horizon Backend (ctl.sock) -->
  <path d="M 690 205 L 760 205" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="760,202 768,205 760,208" fill="#a855f7"/>
  <text x="695" y="222" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5" fill="#a855f7">#7484 IPC Turbo</text>

  <!-- NODE 1: PLAYERS -->
  <g transform="translate(50, 135)">
    <rect width="140" height="90" rx="10" fill="url(#cardGrad)" stroke="#25355a" stroke-width="1.2"/>
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">CLIENTS</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Players</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">Vanilla &amp; Horizon</text>
  </g>

  <!-- NODE 2: MERIDIAN PROXY -->
  <g transform="translate(260, 125)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#38bdf8">MERIDIAN PROXY</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Reverse Proxy</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Fast packet router (Rust)</text>
    <text x="16" y="90" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#10b981">HMAC-SHA256 Token</text>
  </g>

  <!-- NODE 3: ZENITH GATEKEEPER & LIMBO (HIGHLIGHTED) -->
  <g transform="translate(510, 115)">
    <rect width="180" height="130" rx="10" fill="url(#zenithHighlight)" stroke="#f59e0b" stroke-width="2"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#f59e0b">ZENITH DAEMON</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Virtual Limbo</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Zero-Chunk Void (sub-1KiB)</text>
    <text x="16" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Adaptive Wave Queue</text>
    <text x="16" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">• Cyber-Defense Shield</text>
  </g>

  <!-- NODE 4: BACKENDS -->
  <g transform="translate(770, 125)">
    <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#10b981">GAME BACKENDS</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#ffffff">Horizon / Paper</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Target gameplay servers</text>
    <text x="16" y="90" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#a855f7">#7484 Pre-warm ready</text>
  </g>

  <!-- Bottom Explanatory Row -->
  <g transform="translate(50, 360)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="125" rx="10" fill="url(#cardGrad)" stroke="#25355a" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. MERIDIAN DELESTING</text>
      <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">
        <tspan x="18" dy="0">When game servers crash or restart,</tspan>
        <tspan x="18" dy="16">Meridian routes connecting traffic</tspan>
        <tspan x="18" dy="16">to Zenith virtual holding.</tspan>
      </text>
      <text x="18" y="106" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#10b981">Zero players kicked to menu.</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(310, 0)">
      <rect width="280" height="125" rx="10" fill="url(#cardGrad)" stroke="#25355a" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f59e0b">2. LIMBO HOLD &amp; DEFENSE</text>
      <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">
        <tspan x="18" dy="0">Zenith absorbs the load with sub-1KiB</tspan>
        <tspan x="18" dy="16">RAM actors, BossBar HUD, and</tspan>
        <tspan x="18" dy="16">deflects DDoS / bot attacks.</tspan>
      </text>
      <text x="18" y="106" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#10b981">100% Shield deflection rate.</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(620, 0)">
      <rect width="280" height="125" rx="10" fill="url(#cardGrad)" stroke="#25355a" stroke-width="1.2"/>
      <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10b981">3. SEAMLESS DRAIN (0x84)</text>
      <text x="18" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">
        <tspan x="18" dy="0">Once backends recover, Totem</tspan>
        <tspan x="18" dy="16">detects health and Zenith transfers</tspan>
        <tspan x="18" dy="16">players in waves with VIP priority.</tspan>
      </text>
      <text x="18" y="106" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#10b981">Instant client-side transfer.</text>
    </g>
  </g>
</svg>
