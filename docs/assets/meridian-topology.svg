<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" role="img" aria-labelledby="mt-title mt-desc" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,sans-serif">
<title id="mt-title">Meridian &amp; Zenith Integration Topology</title>
<desc id="mt-desc">Players connect to the Meridian reverse proxy, which routes directly to game backends or fails over to the Zenith virtual Limbo daemon, which drains players back to the backends with 0x84 transfers.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1a"/><stop offset="1" stop-color="#0b1329"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.9" fill="#6f8fd6" fill-opacity="0.16"/></pattern>
<radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.14"/><stop offset="0.6" stop-color="#34d399" stop-opacity="0.05"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14203f"/><stop offset="1" stop-color="#0c1430"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe0ff" stop-opacity="0"/><stop offset="0.5" stop-color="#cfe0ff" stop-opacity="0.5"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></linearGradient>
<linearGradient id="zenStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="blur" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
<marker id="aCyan" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#22d3ee"/></marker>
<marker id="aAmber" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#fbbf24"/></marker>
<marker id="aSlate" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#8ea3cb"/></marker>
<marker id="aEmerald" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#34d399"/></marker>
<marker id="aViolet" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#a78bfa"/></marker>
<clipPath id="topo-clip-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
</defs>
<rect width="1000" height="520" fill="url(#bg)"/>
<rect width="1000" height="520" fill="url(#dots)"/>
<rect x="-240" y="-260" width="640" height="560" fill="url(#glowA)"/>
<rect x="640" y="300" width="640" height="520" fill="url(#glowB)"/>
<text x="50" y="56" font-size="18" font-weight="700" letter-spacing="1.2" fill="#eef3ff">MERIDIAN &amp; ZENITH INTEGRATION TOPOLOGY</text>
<text x="50" y="78" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#8fa0c4">REVERSE PROXY ROUTING, HMAC CRYPTOGRAPHIC FORWARDING &amp; SEAMLESS TRANSIT</text>
<rect x="50" y="94" width="900" height="1" fill="#8aa4ff" fill-opacity="0.12"/>
<path d="M 350 160 C 350 104, 860 104, 860 160" fill="none" stroke="#8ea3cb" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#aSlate)"/>
<text x="605" y="111" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#9db0d4">Normal Direct Routing (Online)</text>
<rect x="510" y="160" width="190" height="140" rx="14" fill="#fbbf24" fill-opacity="0.16" filter="url(#blur)"/>
<rect x="50" y="160" width="140" height="140" rx="14" fill="url(#card)" stroke="#8aa4ff" stroke-opacity="0.22"/>
<rect x="64" y="160" width="112" height="1" fill="url(#hl)"/>
<text x="68" y="192" font-size="11" font-weight="700" letter-spacing="1.4" fill="#22d3ee">CLIENTS</text>
<text x="68" y="218" font-size="14" font-weight="600" fill="#eef3ff">Players</text>
<text x="68" y="237" font-size="9.5" fill="#8fa0c4">Vanilla 1.21+</text>
<text x="68" y="250" font-size="9.5" fill="#8fa0c4">&amp; Horizon</text>
<rect x="260" y="160" width="180" height="140" rx="14" fill="url(#card)" stroke="#8aa4ff" stroke-opacity="0.22"/>
<rect x="274" y="160" width="152" height="1" fill="url(#hl)"/>
<text x="278" y="192" font-size="11" font-weight="700" letter-spacing="1.4" fill="#22d3ee">MERIDIAN PROXY</text>
<text x="278" y="218" font-size="14" font-weight="600" fill="#eef3ff">Reverse Proxy</text>
<text x="278" y="237" font-size="9.5" fill="#8fa0c4">Rust async router</text>
<rect x="278" y="252" width="124" height="24" rx="7" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.35"/>
<text x="290" y="268" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#34d399">HMAC-SHA256 Token</text>
<rect x="510" y="160" width="190" height="140" rx="14" fill="url(#card)" stroke="url(#zenStroke)" stroke-width="1.4"/>
<rect x="524" y="160" width="162" height="1" fill="url(#hl)"/>
<text x="530" y="192" font-size="11" font-weight="700" letter-spacing="1.4" fill="#fbbf24">ZENITH DAEMON</text>
<text x="530" y="218" font-size="14" font-weight="600" fill="#eef3ff">Virtual Limbo</text>
<text x="530" y="244" font-size="9.8" fill="#b9c6e6">• Zero-Chunk Void (sub-1KiB)</text>
<text x="530" y="261" font-size="9.8" fill="#b9c6e6">• Adaptive Wave Queue</text>
<text x="530" y="278" font-size="9.8" fill="#b9c6e6">• Cyber-Defense Shield</text>
<rect x="770" y="160" width="180" height="140" rx="14" fill="url(#card)" stroke="#8aa4ff" stroke-opacity="0.22"/>
<rect x="784" y="160" width="152" height="1" fill="url(#hl)"/>
<text x="788" y="192" font-size="11" font-weight="700" letter-spacing="1.4" fill="#34d399">GAME BACKENDS</text>
<text x="788" y="218" font-size="14" font-weight="600" fill="#eef3ff">Horizon / Paper</text>
<rect x="788" y="252" width="144" height="24" rx="7" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.38"/>
<text x="800" y="268" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#a78bfa">0x84 Pre-warm ready</text>
<path d="M 190 232 H 260" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#aCyan)"/>
<text x="225" y="212" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#22d3ee">:25565</text>
<text x="225" y="223" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#22d3ee">Handshake</text>
<path d="M 440 232 H 510" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#aAmber)"/>
<text x="475" y="212" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#fbbf24">Crash/Hold</text>
<text x="475" y="223" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#fbbf24">Failover</text>
<path d="M 640 300 V 318 Q 640 328 650 328 H 800 Q 810 328 810 318 V 300" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#aEmerald)"/>
<text x="725" y="321" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#34d399">0x84 Transfer (Wave Drain)</text>
<path d="M 600 300 V 342 Q 600 352 610 352 H 890 Q 900 352 900 342 V 300" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aViolet)"/>
<text x="750" y="345" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="8.5" fill="#a78bfa">#7484 IPC Turbo (ctl.sock)</text>
<rect x="50" y="385" width="286" height="115" rx="14" fill="url(#card)" stroke="#8aa4ff" stroke-opacity="0.2"/>
<rect x="64" y="385" width="258" height="1" fill="url(#hl)"/>
<text x="68" y="410" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#22d3ee">1. MERIDIAN DELESTING</text>
<text x="68" y="432" font-size="10.5" fill="#aab8da">When game servers crash or restart,</text>
<text x="68" y="447" font-size="10.5" fill="#aab8da">Meridian routes connecting traffic to</text>
<text x="68" y="462" font-size="10.5" fill="#aab8da">Zenith virtual holding.</text>
<rect x="68" y="472" width="250" height="1" fill="#8aa4ff" fill-opacity="0.12"/>
<text x="68" y="490" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#34d399">Zero players kicked to menu.</text>
<rect x="356" y="385" width="286" height="115" rx="14" fill="url(#card)" stroke="#8aa4ff" stroke-opacity="0.2"/>
<rect x="370" y="385" width="258" height="1" fill="url(#hl)"/>
<text x="374" y="410" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#fbbf24">2. LIMBO HOLD &amp; DEFENSE</text>
<text x="374" y="432" font-size="10.5" fill="#aab8da">Zenith absorbs the load with sub-1KiB</text>
<text x="374" y="447" font-size="10.5" fill="#aab8da">RAM actors, BossBar HUD, and deflects</text>
<text x="374" y="462" font-size="10.5" fill="#aab8da">DDoS / bot attacks.</text>
<rect x="374" y="472" width="250" height="1" fill="#8aa4ff" fill-opacity="0.12"/>
<text x="374" y="490" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#34d399">100% Shield deflection rate.</text>
<rect x="662" y="385" width="286" height="115" rx="14" fill="url(#card)" stroke="#8aa4ff" stroke-opacity="0.2"/>
<rect x="676" y="385" width="258" height="1" fill="url(#hl)"/>
<text x="680" y="410" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#34d399">3. SEAMLESS DRAIN (0x84)</text>
<text x="680" y="432" font-size="10.5" fill="#aab8da">Once backends recover, Totem detects</text>
<text x="680" y="447" font-size="10.5" fill="#aab8da">health and Zenith transfers players in</text>
<text x="680" y="462" font-size="10.5" fill="#aab8da">waves with VIP priority.</text>
<rect x="680" y="472" width="250" height="1" fill="#8aa4ff" fill-opacity="0.12"/>
<text x="680" y="490" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="9.5" fill="#34d399">Instant client-side transfer.</text>
</svg>