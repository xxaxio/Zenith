    <linearGradient id="topCyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.85"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
