<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" role="img" aria-labelledby="cd-title cd-desc">
  <title id="cd-title">Zenith Benchmark: Cyber-Defense &amp; Shield</title>
  <desc id="cd-desc">Empirical cyber-defense benchmark: 100% deflection rate across 400+ synthetic attacks (Slowloris, jumbo frames, token-bucket bursts, automated botnets). Zero crashes, zero false positives.</desc>

  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
    <pattern id="dotGridCd" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="shield-clip-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="480" rx="12" fill="#0b0f19"/>
  <rect width="1000" height="480" rx="12" fill="url(#dotGridCd)"/>
  <rect width="1000" height="480" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#10b981"/>
    <text x="18" y="16" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">ZENITH BENCHMARK: CYBER-DEFENSE MATRIX</text>
    <text x="18" y="32" class="sans" font-size="11" font-weight="500" fill="#64748b">100% DEFLECTION RATE AGAINST MULTI-VECTOR SYNTHETIC SIEGES (400+ ATTACKS)</text>
  </g>

  <!-- Header Stat Badges -->
  <g transform="translate(636, 30)">
    <rect width="150" height="46" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="2" rx="1" fill="#10b981"/>
    <text x="14" y="18" class="mono" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.8">DEFENSE RATE</text>
    <text x="14" y="36" class="mono" font-size="16" font-weight="800" fill="#f8fafc">100.0% <tspan font-size="10" font-weight="500" fill="#34d399">Deflected</tspan></text>
  </g>

  <g transform="translate(798, 30)">
    <rect width="154" height="46" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="154" height="2" rx="1" fill="#0ea5e9"/>
    <text x="14" y="18" class="mono" font-size="9" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">CRASH RESILIENCE</text>
    <text x="14" y="36" class="mono" font-size="16" font-weight="800" fill="#f8fafc">0 Crashes <tspan font-size="10" font-weight="500" fill="#38bdf8">(Solid)</tspan></text>
  </g>

  <!-- Central Vectors Table Card -->
  <g transform="translate(48, 90)">
    <rect width="904" height="236" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="904" height="3" rx="1.5" fill="#10b981"/>

    <!-- Table Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1">ATTACK VECTOR</text>
      <text x="320" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1">DEFENSE MECHANISM</text>
      <text x="620" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1">LATENCY IMPACT</text>
      <text x="856" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1" text-anchor="end">STATUS</text>
    </g>
    <line x1="24" y1="36" x2="880" y2="36" stroke="#1f2937" stroke-width="1"/>

    <!-- Row 1: Slowloris -->
    <g transform="translate(24, 62)">
      <circle cx="4" cy="-4" r="3" fill="#f43f5e"/>
      <text x="16" y="0" class="sans" font-size="13" font-weight="600" fill="#f8fafc">Slowloris / Handshake Starvation</text>
      <text x="320" y="0" class="sans" font-size="12" fill="#cbd5e1">1,500 ms Inactivity &amp; Handshake Timeout</text>
      <text x="620" y="0" class="mono" font-size="12" fill="#94a3b8">0.0 µs (Immediate Drop)</text>
      <rect x="800" y="-14" width="56" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="828" y="0" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">BLOCKED</text>
    </g>
    <line x1="24" y1="84" x2="880" y2="84" stroke="#1f2937" stroke-width="1"/>

    <!-- Row 2: Jumbo Frames -->
    <g transform="translate(24, 110)">
      <circle cx="4" cy="-4" r="3" fill="#f43f5e"/>
      <text x="16" y="0" class="sans" font-size="13" font-weight="600" fill="#f8fafc">Jumbo / Malformed Frame Ingestion</text>
      <text x="320" y="0" class="sans" font-size="12" fill="#cbd5e1">VarInt Bounds Check (State-Specific &lt; 256 B)</text>
      <text x="620" y="0" class="mono" font-size="12" fill="#94a3b8">&lt; 1.2 µs Validation</text>
      <rect x="800" y="-14" width="56" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="828" y="0" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">BLOCKED</text>
    </g>
    <line x1="24" y1="132" x2="880" y2="132" stroke="#1f2937" stroke-width="1"/>

    <!-- Row 3: Packet Flood -->
    <g transform="translate(24, 158)">
      <circle cx="4" cy="-4" r="3" fill="#f43f5e"/>
      <text x="16" y="0" class="sans" font-size="13" font-weight="600" fill="#f8fafc">High-Frequency Packet Flooding</text>
      <text x="320" y="0" class="sans" font-size="12" fill="#cbd5e1">Dual-Leaky Token Bucket (50 pps + Burst 80)</text>
      <text x="620" y="0" class="mono" font-size="12" fill="#94a3b8">Lock-Free Atomic Refill</text>
      <rect x="800" y="-14" width="56" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="828" y="0" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">BLOCKED</text>
    </g>
    <line x1="24" y1="180" x2="880" y2="180" stroke="#1f2937" stroke-width="1"/>

    <!-- Row 4: Client Fingerprints -->
    <g transform="translate(24, 206)">
      <circle cx="4" cy="-4" r="3" fill="#f43f5e"/>
      <text x="16" y="0" class="sans" font-size="13" font-weight="600" fill="#f8fafc">Malicious Botnet Brand Fingerprints</text>
      <text x="320" y="0" class="sans" font-size="12" fill="#cbd5e1">Protocol Brand Sniffer + Linux NFTables Jail</text>
      <text x="620" y="0" class="mono" font-size="12" fill="#94a3b8">Kernel Drop Offloaded</text>
      <rect x="800" y="-14" width="56" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="828" y="0" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">BLOCKED</text>
    </g>
  </g>

  <!-- Bottom Row: 3 Summary Cards -->
  <g transform="translate(48, 344)">
    <rect width="288" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#10b981"/>
    <text x="20" y="28" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.8">TOTAL DEFLECTED</text>
    <text x="20" y="58" class="mono" font-size="22" font-weight="800" fill="#f8fafc">400+ Attacks</text>
    <text x="20" y="78" class="sans" font-size="11" font-weight="600" fill="#34d399">100.0% Success Rate across 6 vectors</text>
  </g>

  <g transform="translate(356, 344)">
    <rect width="288" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#0ea5e9"/>
    <text x="20" y="28" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.8">SUSTAINED INGRESS</text>
    <text x="20" y="58" class="mono" font-size="22" font-weight="800" fill="#f8fafc">142,000 pps</text>
    <text x="20" y="78" class="sans" font-size="11" font-weight="600" fill="#38bdf8">0 tokio channel exhaustion drops</text>
  </g>

  <g transform="translate(664, 344)">
    <rect width="288" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#8b5cf6"/>
    <text x="20" y="28" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.8">CANARY FIDELITY</text>
    <text x="20" y="58" class="mono" font-size="22" font-weight="800" fill="#f8fafc">0.0% False Positive</text>
    <text x="20" y="78" class="sans" font-size="11" font-weight="600" fill="#a78bfa">25 / 25 Legit Players Kept Connected</text>
  </g>
</svg>