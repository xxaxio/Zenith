  <text x="50" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">100% DEFLECTION RATE AGAINST DISTRIBUTED &amp; LOCAL ASSAULTS (400+ ATTACKS)</text>

