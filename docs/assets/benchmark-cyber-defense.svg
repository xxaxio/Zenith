    <g transform="translate(0, 0)">
      <rect width="435" height="70" rx="8" fill="url(#cardGrad)" stroke="#25355a" stroke-width="1.2"/>
      <circle cx="28" cy="35" r="14" fill="#0284c7" opacity="0.2"/>
      <text x="22" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#38bdf8">🛡</text>
