<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" role="img" aria-labelledby="kpi-title kpi-desc">
  <title id="kpi-title">Zenith Performance &amp; Defense Metrics</title>
  <desc id="kpi-desc">Key performance indicators measured empirically under high load: 489 attacker IPs jailed at kernel, 85,205 concurrent active sessions sustained at under 195 MB RAM, and 395,000 tick cycles across 2,000 interactive players.</desc>

  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
    <pattern id="dotGridKpi" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="kpi-bounds-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="12" fill="#0b0f19"/>
  <rect width="1000" height="320" rx="12" fill="url(#dotGridKpi)"/>
  <rect width="1000" height="320" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#10b981"/>
    <text x="18" y="16" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">ZENITH BENCHMARK: KEY METRICS</text>
    <text x="18" y="32" class="sans" font-size="11" font-weight="500" fill="#64748b">MEASURED ON AMD RYZEN 9 5900X • BARE-METAL LINUX NODE • PROTOCOL 777</text>
  </g>

  <!-- Live Verified Badge -->
  <g transform="translate(830, 36)">
    <rect width="122" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#10b981"/>
    <text x="24" y="18" class="mono" font-size="10.5" font-weight="600" fill="#10b981">100% EMPIRICAL</text>
  </g>

  <!-- ==================== THREE KPI CARDS ==================== -->
  <!-- Card 1: 489 IPs -->
  <g transform="translate(48, 88)">
    <rect width="288" height="196" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#10b981"/>
    <g transform="translate(20, 24)">
      <rect width="84" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="42" y="14" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">KERNEL SIEGE</text>
      
      <text x="0" y="64" class="mono" font-size="36" font-weight="800" fill="#f8fafc">489 <tspan font-size="18" font-weight="600" fill="#10b981">IPs</tspan></text>
      <text x="0" y="90" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">100% Dropped at Kernel</text>
      <text x="0" y="112" class="sans" font-size="11" fill="#64748b">0 server crashes across 600 attackers</text>
      
      <line x1="0" y1="126" x2="248" y2="126" stroke="#1f2937" stroke-width="1"/>
      <circle cx="6" cy="144" r="3" fill="#10b981"/>
      <text x="16" y="148" class="sans" font-size="11" font-weight="600" fill="#34d399">25 / 25 Canaries Unharmed (0% FP)</text>
    </g>
  </g>

  <!-- Card 2: 85,205 Sessions -->
  <g transform="translate(356, 88)">
    <rect width="288" height="196" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#0ea5e9"/>
    <g transform="translate(20, 24)">
      <rect width="112" height="20" rx="4" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-opacity="0.3"/>
      <text x="56" y="14" class="mono" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">SATURATION PEAK</text>
      
      <text x="0" y="64" class="mono" font-size="36" font-weight="800" fill="#f8fafc">85,205 <tspan font-size="18" font-weight="600" fill="#0ea5e9">SESS</tspan></text>
      <text x="0" y="90" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">Concurrent Active Sessions</text>
      <text x="0" y="112" class="sans" font-size="11" fill="#64748b">299 µs avg RTT · &lt;12.5% CPU (1 core)</text>
      
      <line x1="0" y1="126" x2="248" y2="126" stroke="#1f2937" stroke-width="1"/>
      <circle cx="6" cy="144" r="3" fill="#0ea5e9"/>
      <text x="16" y="148" class="sans" font-size="11" font-weight="600" fill="#38bdf8">&lt; 1 KiB / Session (195 MB Total RSS)</text>
    </g>
  </g>

  <!-- Card 3: 2,000 Players 20Hz -->
  <g transform="translate(664, 88)">
    <rect width="288" height="196" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#8b5cf6"/>
    <g transform="translate(20, 24)">
      <rect width="90" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
      <text x="45" y="14" class="mono" font-size="9" font-weight="700" fill="#a78bfa" text-anchor="middle">REAL 20HZ TICK</text>
      
      <text x="0" y="64" class="mono" font-size="36" font-weight="800" fill="#f8fafc">395 <tspan font-size="18" font-weight="600" fill="#a78bfa">kTCK</tspan></text>
      <text x="0" y="90" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">2,000 Interactive Players</text>
      <text x="0" y="112" class="sans" font-size="11" fill="#64748b">6,015 PPS sustained throughput</text>
      
      <line x1="0" y1="126" x2="248" y2="126" stroke="#1f2937" stroke-width="1"/>
      <circle cx="6" cy="144" r="3" fill="#8b5cf6"/>
      <text x="16" y="148" class="sans" font-size="11" font-weight="600" fill="#a78bfa">P50 RTT: 19.56 ms (WAN public)</text>
    </g>
  </g>
</svg>