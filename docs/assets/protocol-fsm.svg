<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" role="img" aria-labelledby="fsm-title fsm-desc">
  <title id="fsm-title">Protocol 777 Finite State Machine</title>
  <desc id="fsm-desc">Minecraft Protocol 777 connection state transitions: Handshake, Status SLP, Login, Configuration, and Play virtual void holding with 0x84 transfer packet handover.</desc>

  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
    <pattern id="dotGridFsm" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.8"/>
    </pattern>
    <marker id="fsmCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="fsmPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="fsmGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 Z" fill="#10b981"/>
    </marker>
    <clipPath id="fsm-bounds-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="500" rx="12" fill="#0b0f19"/>
  <rect width="1000" height="500" rx="12" fill="url(#dotGridFsm)"/>
  <rect width="1000" height="500" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#8b5cf6"/>
    <text x="18" y="16" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">PROTOCOL 777 FINITE STATE MACHINE</text>
    <text x="18" y="32" class="sans" font-size="11" font-weight="500" fill="#64748b">ZERO-CHUNK VIRTUAL DIMENSION LIFECYCLE (MINECRAFT 26.3 / 1.21+)</text>
  </g>

  <!-- Top-Right Badge -->
  <g transform="translate(830, 36)">
    <rect width="122" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#8b5cf6"/>
    <text x="24" y="18" class="mono" font-size="10.5" font-weight="600" fill="#a78bfa">ASYNC ACTORS</text>
  </g>

  <!-- Connective Paths -->
  <!-- Handshake -> Status -->
  <path d="M 200 180 C 200 135, 270 135, 330 135" fill="none" stroke="#0ea5e9" stroke-width="1.75" stroke-dasharray="4 3" marker-end="url(#fsmCyan)"/>
  <rect x="230" y="123" width="58" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="259" y="135" class="mono" font-size="9" fill="#38bdf8" text-anchor="middle">Intent = 1</text>

  <!-- Handshake -> Login -->
  <path d="M 200 240 C 200 285, 270 285, 330 285" fill="none" stroke="#8b5cf6" stroke-width="1.75" marker-end="url(#fsmPurple)"/>
  <rect x="230" y="273" width="70" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="265" y="285" class="mono" font-size="9" fill="#a78bfa" text-anchor="middle">Intent = 2 / 3</text>

  <!-- Login -> Configuration -->
  <path d="M 480 285 L 532 285" fill="none" stroke="#8b5cf6" stroke-width="1.75" marker-end="url(#fsmPurple)"/>
  <rect x="488" y="273" width="36" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="506" y="285" class="mono" font-size="9" fill="#a78bfa" text-anchor="middle">0x02</text>

  <!-- Configuration -> Play (Limbo Void) -->
  <path d="M 680 285 L 732 285" fill="none" stroke="#10b981" stroke-width="1.75" marker-end="url(#fsmGreen)"/>
  <rect x="688" y="273" width="36" height="18" rx="4" fill="#0b0f19" stroke="#1e293b"/>
  <text x="706" y="285" class="mono" font-size="9" fill="#10b981" text-anchor="middle">0x03</text>

  <!-- Play -> Backend Transfer -->
  <path d="M 810 355 C 810 405, 540 405, 540 422" fill="none" stroke="#10b981" stroke-width="1.75" stroke-dasharray="5 3" marker-end="url(#fsmGreen)"/>

  <!-- ==================== FSM STATES ==================== -->
  <!-- STATE 1: Handshake -->
  <g transform="translate(48, 160)">
    <rect width="152" height="100" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="152" height="3" rx="1.5" fill="#0ea5e9"/>
    <text x="14" y="24" class="mono" font-size="9" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">STATE 00</text>
    <text x="14" y="46" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Handshake</text>
    <text x="14" y="66" class="sans" font-size="11" fill="#94a3b8">Protocol 777 Version</text>
    <text x="14" y="82" class="sans" font-size="10.5" fill="#64748b">Inspect Host &amp; Intent</text>
  </g>

  <!-- STATE 2: Status (SLP) -->
  <g transform="translate(340, 90)">
    <rect width="140" height="90" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="#0ea5e9"/>
    <text x="14" y="22" class="mono" font-size="9" font-weight="700" fill="#0ea5e9" letter-spacing="0.8">STATE 01</text>
    <text x="14" y="44" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Status / SLP</text>
    <text x="14" y="62" class="sans" font-size="10.5" fill="#94a3b8">Dynamic Ping Response</text>
    <text x="14" y="76" class="sans" font-size="10" fill="#64748b">Queue Size in MOTD</text>
  </g>

  <!-- STATE 3: Login -->
  <g transform="translate(340, 240)">
    <rect width="140" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="#8b5cf6"/>
    <text x="14" y="22" class="mono" font-size="9" font-weight="700" fill="#a78bfa" letter-spacing="0.8">STATE 02</text>
    <text x="14" y="44" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Login Start</text>
    <text x="14" y="64" class="sans" font-size="10.5" fill="#94a3b8">UUID &amp; Username Check</text>
    <text x="14" y="80" class="sans" font-size="10" fill="#64748b">Login Success (0x02)</text>
  </g>

  <!-- STATE 4: Configuration -->
  <g transform="translate(540, 240)">
    <rect width="140" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="#8b5cf6"/>
    <text x="14" y="22" class="mono" font-size="9" font-weight="700" fill="#a78bfa" letter-spacing="0.8">STATE 03</text>
    <text x="14" y="44" class="sans" font-size="13" font-weight="700" fill="#f8fafc">Configuration</text>
    <text x="14" y="64" class="sans" font-size="10.5" fill="#94a3b8">Known Packs • Features</text>
    <text x="14" y="80" class="sans" font-size="10" fill="#64748b">Finish Config (0x03)</text>
  </g>

  <!-- STATE 5: Play (Limbo Void Core) -->
  <g transform="translate(740, 224)">
    <rect width="212" height="130" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.75"/>
    <rect x="0" y="0" width="212" height="3" rx="1.5" fill="#10b981"/>
    <text x="16" y="24" class="mono" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.8">STATE 04 • VIRTUAL VOID</text>
    <text x="16" y="46" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Play: Limbo Holding</text>
    <text x="16" y="66" class="sans" font-size="10.5" fill="#94a3b8">• LevelChunksLoadStart (0x27)</text>
    <text x="16" y="82" class="sans" font-size="10.5" fill="#94a3b8">• ChunkBatchFinished (0x0C)</text>
    <text x="16" y="98" class="sans" font-size="10.5" fill="#94a3b8">• BossBar &amp; Actionbar HUD</text>
    <rect x="16" y="104" width="180" height="16" rx="3" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.25"/>
    <text x="106" y="115" class="mono" font-size="8.5" font-weight="600" fill="#34d399" text-anchor="middle">Dismisses "Loading Terrain..."</text>
  </g>

  <!-- HANDOVER EGRESS -->
  <g transform="translate(420, 420)">
    <rect width="240" height="56" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="2" rx="1" fill="#10b981"/>
    <text x="16" y="22" class="mono" font-size="9" font-weight="700" fill="#10b981" letter-spacing="0.8">BACKEND TRANSIT HANDOVER</text>
    <text x="16" y="42" class="mono" font-size="12" font-weight="700" fill="#f8fafc">0x84 Transfer <tspan font-size="10" font-weight="500" fill="#64748b">(Host + Port)</tspan></text>
  </g>
</svg>