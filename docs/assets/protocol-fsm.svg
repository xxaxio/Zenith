<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFsm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="gridFsm" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Invisible cryptographic provenance watermark (steganographic path seed) -->
    <path id="zx-provenance-e3b0c4" d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z" opacity="0"/>
  </defs>

  <rect width="1000" height="500" rx="14" fill="url(#bgFsm)"/>
  <rect width="1000" height="500" rx="14" fill="url(#gridFsm)"/>
  <rect width="1000" height="500" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="0.5">PROTOCOL 777 FINITE STATE MACHINE</text>
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">ZERO-CHUNK VIRTUAL DIMENSION LIFECYCLE (MINECRAFT 26.3)</text>

  <!-- Connective Arrows -->
  <!-- Handshake -> Status -->
  <path d="M 230 190 C 230 140, 310 140, 370 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="370,136 380,140 370,144" fill="#38bdf8"/>
  <text x="270" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Intent = 1</text>

  <!-- Handshake -> Login -->
  <path d="M 230 230 C 230 280, 310 280, 370 280" fill="none" stroke="#a855f7" stroke-width="2"/>
  <polygon points="370,276 380,280 370,284" fill="#a855f7"/>
  <text x="270" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#c084fc">Intent = 2 / 3</text>

  <!-- Login -> Config -->
  <path d="M 520 280 L 570 280" fill="none" stroke="#a855f7" stroke-width="2"/>
  <polygon points="570,276 580,280 570,284" fill="#a855f7"/>

  <!-- Config -> Play / InLimbo -->
  <path d="M 720 280 L 770 280" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <polygon points="770,276 780,280 770,284" fill="#10b981"/>

  <!-- Play -> Transfer -->
  <path d="M 875 350 L 875 410" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3"/>
  <polygon points="871,410 875,420 879,410" fill="#38bdf8"/>

  <!-- STATE 0: HANDSHAKE -->
  <g transform="translate(60, 160)">
    <rect width="170" height="100" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">STATE 0</text>
    <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Handshake</text>
    <text x="16" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Packet 0x00</text>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">Protocol 777 Check</text>
  </g>

  <!-- STATE 1: STATUS -->
  <g transform="translate(380, 90)">
    <rect width="140" height="90" rx="10" fill="url(#cardGrad)" stroke="#25355a" stroke-width="1.5"/>
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">STATE 1</text>
    <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Status &amp; Ping</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">MOTD JSON Response</text>
    <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Ping / Pong RTT</text>
  </g>

  <!-- STATE 2: LOGIN -->
  <g transform="translate(380, 230)">
    <rect width="140" height="100" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#c084fc">STATE 2</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Login Phase</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">0x00 LoginStart</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">0x02 LoginSuccess</text>
  </g>

  <!-- STATE 3: CONFIGURATION -->
  <g transform="translate(580, 230)">
    <rect width="140" height="100" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#c084fc">STATE 3</text>
    <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff">Configuration</text>
    <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">CB 0x03 FinishConfig</text>
    <text x="14" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">SB 0x03 Acknowledged</text>
  </g>

  <!-- STATE 4: IN LIMBO (PLAY) -->
  <g transform="translate(780, 210)">
    <rect width="190" height="140" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">STATE 4 (PLAY)</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">InLimbo Holding</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">ID 50: LoginPlay (Void)</text>
    <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">ID 73: Sync Position (Y=64)</text>
    <text x="16" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">ID 45/28: KeepAlive Loop</text>
    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981">ZERO CHUNKS LOADED</text>
  </g>

  <!-- TRANSFER DESTINATION -->
  <g transform="translate(780, 420)">
    <rect width="190" height="50" rx="8" fill="#111d33" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">TRANSFER DISPATCH</text>
    <text x="16" y="40" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#cbd5e1">0x7C Transfer [Host:Port]</text>
  </g>
</svg>
