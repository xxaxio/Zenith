<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" role="img" aria-labelledby="mem-title mem-desc">
  <title id="mem-title">Zenith Benchmark: High-Density Memory Profile</title>
  <desc id="mem-desc">Measured RSS footprint comparison: Zenith 2.58 MiB idle, 9.52 MiB with 500 bots, 9.86 MiB with 1,000 bots, versus legacy JVM servers exceeding 1,200 MiB.</desc>

  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
    <pattern id="dotGridMem" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="chart-clip-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="480" rx="12" fill="#0b0f19"/>
  <rect width="1000" height="480" rx="12" fill="url(#dotGridMem)"/>
  <rect width="1000" height="480" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#0ea5e9"/>
    <text x="18" y="16" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">ZENITH BENCHMARK: HIGH-DENSITY MEMORY</text>
    <text x="18" y="32" class="sans" font-size="11" font-weight="500" fill="#64748b">RESIDENT SET SIZE (RSS) MEASURED ACROSS CONCURRENT SESSIONS</text>
  </g>

  <!-- Top-Right Badge -->
  <g transform="translate(806, 36)">
    <rect width="146" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#0ea5e9"/>
    <text x="24" y="18" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">&lt; 1 KiB / SESSION</text>
  </g>

  <!-- Central Comparison Chart Card -->
  <g transform="translate(48, 88)">
    <rect width="904" height="248" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="904" height="3" rx="1.5" fill="#0ea5e9"/>

    <g transform="translate(24, 24)">
      <text x="0" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1">CONFIGURATION</text>
      <text x="240" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1">RELATIVE RSS FOOTPRINT</text>
      <text x="856" y="0" class="mono" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1" text-anchor="end">RSS RAM</text>
    </g>
    <line x1="24" y1="36" x2="880" y2="36" stroke="#1f2937" stroke-width="1"/>

    <!-- Row 1: Zenith Idle -->
    <g transform="translate(24, 60)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#f8fafc">Zenith (Idle)</text>
      <rect x="240" y="-12" width="12" height="16" rx="3" fill="#10b981"/>
      <text x="856" y="0" class="mono" font-size="12" font-weight="700" fill="#10b981" text-anchor="end">2.58 MiB</text>
    </g>

    <!-- Row 2: Zenith 500 Bots -->
    <g transform="translate(24, 96)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="600" fill="#f8fafc">Zenith (500 Real Bots)</text>
      <rect x="240" y="-12" width="28" height="16" rx="3" fill="#10b981"/>
      <text x="856" y="0" class="mono" font-size="12" font-weight="700" fill="#10b981" text-anchor="end">9.52 MiB</text>
    </g>

    <!-- Row 3: Zenith 1,000 Bots (Hero) -->
    <g transform="translate(24, 132)">
      <text x="0" y="0" class="sans" font-size="12" font-weight="700" fill="#38bdf8">Zenith (1,000 Real Bots, 20 Hz)</text>
      <rect x="240" y="-12" width="34" height="16" rx="3" fill="#0ea5e9"/>
      <text x="856" y="0" class="mono" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="end">9.86 MiB</text>
    </g>
    <line x1="24" y1="148" x2="880" y2="148" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Row 4: Paper Limbo -->
    <g transform="translate(24, 172)">
      <text x="0" y="0" class="sans" font-size="12" fill="#94a3b8">Legacy Paper (Limbo Plugin)</text>
      <rect x="240" y="-12" width="240" height="16" rx="3" fill="#334155"/>
      <text x="856" y="0" class="mono" font-size="12" fill="#94a3b8" text-anchor="end">420.0 MiB</text>
    </g>

    <!-- Row 5: Velocity Holding -->
    <g transform="translate(24, 204)">
      <text x="0" y="0" class="sans" font-size="12" fill="#94a3b8">Velocity (Queue Holding)</text>
      <rect x="240" y="-12" width="380" height="16" rx="3" fill="#334155"/>
      <text x="856" y="0" class="mono" font-size="12" fill="#94a3b8" text-anchor="end">680.0 MiB</text>
    </g>

    <!-- Row 6: Vanilla Backend -->
    <g transform="translate(24, 236)">
      <text x="0" y="0" class="sans" font-size="12" fill="#64748b">Vanilla Java Server (World gen)</text>
      <rect x="240" y="-12" width="580" height="16" rx="3" fill="#1f2937"/>
      <text x="856" y="0" class="mono" font-size="12" fill="#64748b" text-anchor="end">1,280.0 MiB</text>
    </g>
  </g>

  <!-- Bottom KPI Row: 3 Cards -->
  <g transform="translate(48, 356)">
    <rect width="288" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#0ea5e9"/>
    <text x="20" y="28" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.8">1,000 CONCURRENT BOTS</text>
    <text x="20" y="58" class="mono" font-size="22" font-weight="800" fill="#f8fafc">9.86 MiB RSS</text>
    <text x="20" y="78" class="sans" font-size="11" font-weight="600" fill="#38bdf8">100% Rust zero-chunk actors</text>
  </g>

  <g transform="translate(356, 356)">
    <rect width="288" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#10b981"/>
    <text x="20" y="28" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.8">PER-SESSION DENSITY</text>
    <text x="20" y="58" class="mono" font-size="22" font-weight="800" fill="#f8fafc">&lt; 1 KiB / Session</text>
    <text x="20" y="78" class="sans" font-size="11" font-weight="600" fill="#10b981">986 Bytes average resident delta</text>
  </g>

  <g transform="translate(664, 356)">
    <rect width="288" height="96" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="2" rx="1" fill="#8b5cf6"/>
    <text x="20" y="28" class="mono" font-size="9" font-weight="700" fill="#64748b" letter-spacing="0.8">EFFICIENCY GAIN</text>
    <text x="20" y="58" class="mono" font-size="22" font-weight="800" fill="#f8fafc">42× to 129×</text>
    <text x="20" y="78" class="sans" font-size="11" font-weight="600" fill="#a78bfa">Compared to legacy JVM servers</text>
  </g>
</svg>