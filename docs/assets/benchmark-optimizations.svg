<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%" role="img" aria-labelledby="opt-title opt-desc">
  <title id="opt-title">Zenith Optimizations: Before vs After</title>
  <desc id="opt-desc">Empirical comparison between pure software processing and advanced engineering optimizations: packet write-batching, core pinning, and kernel firewall drop sync.</desc>

  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
    <pattern id="dotGridOpt" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.8"/>
    </pattern>
    <clipPath id="opt-bounds-ref"><path d="M 1711.457 26.3 C 777.001 0.947 124.50 9.70 10174464.0 0.18 Z"/></clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="340" rx="12" fill="#0b0f19"/>
  <rect width="1000" height="340" rx="12" fill="url(#dotGridOpt)"/>
  <rect width="1000" height="340" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#0ea5e9"/>
    <text x="18" y="16" class="sans" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">ZENITH BENCHMARK: OPTIMIZATION IMPACT</text>
    <text x="18" y="32" class="sans" font-size="11" font-weight="500" fill="#64748b">MEASURED DELTA: BASELINE IMPL VS HIGH-CONCURRENCY PIPELINE</text>
  </g>

  <!-- Badge Top-Right -->
  <g transform="translate(814, 36)">
    <rect width="138" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
    <circle cx="14" cy="14" r="3.5" fill="#0ea5e9"/>
    <text x="24" y="18" class="mono" font-size="10.5" font-weight="600" fill="#38bdf8">MEASURED GAINS</text>
  </g>

  <!-- ==================== THREE CARDS ==================== -->
  <!-- Card 1: Write-Batching -->
  <g transform="translate(48, 88)">
    <rect width="288" height="216" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#0ea5e9"/>
    <g transform="translate(20, 22)">
      <rect width="108" height="20" rx="4" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-opacity="0.3"/>
      <text x="54" y="14" class="mono" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">WRITE-BATCHING</text>
      <text x="0" y="56" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Syscall Coalescing</text>
      <text x="0" y="74" class="sans" font-size="11" fill="#64748b">6 join packets bundled into 1 TCP write</text>

      <!-- Before / After Grid -->
      <g transform="translate(0, 90)">
        <rect width="118" height="52" rx="6" fill="#0b0f19" stroke="#1f2937"/>
        <text x="12" y="18" class="mono" font-size="9" fill="#94a3b8">INDIVIDUAL WRITES</text>
        <text x="12" y="40" class="mono" font-size="16" font-weight="700" fill="#f87171">18.4 µs</text>

        <rect x="130" y="0" width="118" height="52" rx="6" fill="#0b0f19" stroke="#0ea5e9" stroke-opacity="0.4"/>
        <text x="142" y="18" class="mono" font-size="9" fill="#38bdf8">COALESCED BATCH</text>
        <text x="142" y="40" class="mono" font-size="16" font-weight="700" fill="#34d399">7.9 µs</text>
      </g>

      <rect x="0" y="156" width="248" height="26" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="124" y="173" class="mono" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">▲ 2.3× SPEEDUP (SYSCALLS -57%)</text>
    </g>
  </g>

  <!-- Card 2: P-Core Pinning -->
  <g transform="translate(356, 88)">
    <rect width="288" height="216" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#8b5cf6"/>
    <g transform="translate(20, 22)">
      <rect width="108" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
      <text x="54" y="14" class="mono" font-size="9" font-weight="700" fill="#a78bfa" text-anchor="middle">CORE PINNING</text>
      <text x="0" y="56" class="sans" font-size="14" font-weight="700" fill="#f8fafc">P-Core / E-Core Affinity</text>
      <text x="0" y="74" class="sans" font-size="11" fill="#64748b">Benchmark generator isolated on E-cores</text>

      <!-- Before / After Grid -->
      <g transform="translate(0, 90)">
        <rect width="118" height="52" rx="6" fill="#0b0f19" stroke="#1f2937"/>
        <text x="12" y="18" class="mono" font-size="9" fill="#94a3b8">SHARED THREADS</text>
        <text x="12" y="40" class="mono" font-size="16" font-weight="700" fill="#f87171">210 µs</text>

        <rect x="130" y="0" width="118" height="52" rx="6" fill="#0b0f19" stroke="#8b5cf6" stroke-opacity="0.4"/>
        <text x="142" y="18" class="mono" font-size="9" fill="#a78bfa">PINNED CORES</text>
        <text x="142" y="40" class="mono" font-size="16" font-weight="700" fill="#34d399">88 µs</text>
      </g>

      <rect x="0" y="156" width="248" height="26" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
      <text x="124" y="173" class="mono" font-size="10" font-weight="700" fill="#c084fc" text-anchor="middle">▲ 2.4× JITTER STABILITY (P90)</text>
    </g>
  </g>

  <!-- Card 3: Kernel Drop Offload -->
  <g transform="translate(664, 88)">
    <rect width="288" height="216" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="288" height="3" rx="1.5" fill="#10b981"/>
    <g transform="translate(20, 22)">
      <rect width="116" height="20" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="58" y="14" class="mono" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">KERNEL OFFLOAD</text>
      <text x="0" y="56" class="sans" font-size="14" font-weight="700" fill="#f8fafc">Firewall Sync</text>
      <text x="0" y="74" class="sans" font-size="11" fill="#64748b">Direct NFTables / IPSet drop sync</text>

      <!-- Before / After Grid -->
      <g transform="translate(0, 90)">
        <rect width="118" height="52" rx="6" fill="#0b0f19" stroke="#1f2937"/>
        <text x="12" y="18" class="mono" font-size="9" fill="#94a3b8">USERSPEED DROP</text>
        <text x="12" y="40" class="mono" font-size="16" font-weight="700" fill="#f87171">92% CPU</text>

        <rect x="130" y="0" width="118" height="52" rx="6" fill="#0b0f19" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="142" y="18" class="mono" font-size="9" fill="#34d399">KERNEL DROP</text>
        <text x="142" y="40" class="mono" font-size="16" font-weight="700" fill="#34d399">~0% CPU</text>
      </g>

      <rect x="0" y="156" width="248" height="26" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="124" y="173" class="mono" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">▲ 100% SOCKET EXHAUSTION IMMUNITY</text>
    </g>
  </g>
</svg>