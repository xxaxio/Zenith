name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: zenith
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: zenith.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p zenith-app --bin zenith --target ${{ matrix.target }}
      - name: Tests
        run: cargo test --workspace --locked
      - name: Package
        shell: bash
        run: |
          dir="zenith-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist-release/$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE zenith.example.toml groups.toml "dist-release/$dir/"
          if [ -d "dist/systemd" ]; then
            cp dist/install.sh dist/uninstall.sh "dist-release/$dir/"
            cp -r dist/systemd "dist-release/$dir/"
          fi
          mkdir -p dist-out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "dist-out/$dir.zip" "./dist-release/$dir/*" > /dev/null
          else
            tar -czf "dist-out/$dir.tar.gz" -C dist-release "$dir"
          fi
          rm -rf dist-release
          ls -la dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-out/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-out
          merge-multiple: true
      - name: Checksums
        working-directory: dist-out
        run: |
          sha256sum zenith-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-out/zenith-*
            dist-out/SHA256SUMS
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-out/* --draft --verify-tag \
              --title "Zenith $GITHUB_REF_NAME" --generate-notes
          fi
