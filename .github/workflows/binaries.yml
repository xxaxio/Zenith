name: Binaries

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: zenith
            bench_exe: zenith-bench
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: zenith.exe
            bench_exe: zenith-bench.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: |
          cargo build --release --locked -p zenith-app --bin zenith --target ${{ matrix.target }}
          cargo build --release --locked -p zenith-bench --bin zenith-bench --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          sha12="${GITHUB_SHA:0:12}"
          name="zenith-${sha12}-${{ matrix.name }}"
          mkdir -p "dist-release/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "target/${{ matrix.target }}/release/${{ matrix.bench_exe }}" README.md LICENSE zenith.example.toml "dist-release/$name/"
          if [ -d "dist/systemd" ]; then
            cp dist/install.sh dist/uninstall.sh "dist-release/$name/"
            cp -r dist/systemd "dist-release/$name/"
          fi
          mkdir -p dist-out
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "dist-out/$name.zip" "./dist-release/$name/*" > /dev/null
          else
            tar -czf "dist-out/$name.tar.gz" -C dist-release "$name"
          fi
          rm -rf dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ matrix.name }}
          path: dist-out/*
          retention-days: 14
          if-no-files-found: error
